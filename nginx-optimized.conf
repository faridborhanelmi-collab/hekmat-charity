server {
    listen 80;
    server_name hekmat.neromoda.ir hekmatfoundation.org www.hekmatfoundation.org hekmatfoundation.ir www.hekmatfoundation.ir;
    return 301 https://hekmatfoundation.org$request_uri;
}

server {
    listen 443 ssl;
    server_name hekmat.neromoda.ir hekmatfoundation.org www.hekmatfoundation.org hekmatfoundation.ir www.hekmatfoundation.ir;

    root /home/hekmat.neromoda.ir/public_html;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/hekmatfoundation.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hekmatfoundation.org/privkey.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    access_log /var/log/nginx/hekmat_access.log;
    error_log /var/log/nginx/hekmat_error.log;

    # ─── GZIP COMPRESSION ───────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff2
        font/woff;

    # ─── BROWSER CACHING ─────────────────────────────────────
    # Static assets: 1 year cache
    location ~* \.(woff2|woff|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg)$ {
        expires 6M;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(mp4|webm|ogg)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ─── SECURITY HEADERS ─────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── UPLOADS SECURITY ─────────────────────────────────────
    location ^~ /uploads/ {
        # مسدودسازی قطعی هرگونه اجرای اسکریپت PHP یا اجرایی در پوشه آپلود
        location ~* \.(php[0-9]?|phtml|phar|inc|cgi|pl|py|sh|bash|exe)$ {
            deny all;
            return 403;
        }
        try_files $uri =404;
    }

    # ─── PHP ──────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_read_timeout 300;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # ─── BLOCK SENSITIVE FILES ────────────────────────────────
    location ~* \.(db|sqlite|sql|log|env|py|xlsx|csv|pdf|zip|tar|gz)$ {
        deny all;
        return 403;
    }
}
